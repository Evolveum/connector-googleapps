# Copy to gws-it.local.properties in the project root (ignored by Git).
# UTF-8 Java properties. Do not quote values. Never commit real credentials.
# Environment variables listed below override file values, including an empty value.

# Workspace email domain, NOT an API host/URL. GWS_IT_DOMAIN
domain=
# Both IDs are required by the existing connector validation even when licensing is off.
# GWS_IT_PRODUCT_ID and GWS_IT_SKU_ID
productId=
skuId=
# Recommended for the first CRUD run. GWS_IT_AUTO_ADD_LICENSE
autoAddLicense=false
# OAuth client matching the refresh token. GWS_IT_CLIENT_ID
clientId=
# May be left empty here when injected via GWS_IT_CLIENT_SECRET / GWS_IT_REFRESH_TOKEN.
clientSecret=
refreshToken=

# Optional existing test OU, e.g. /ConnectorTests. Empty uses the default OU.
# GWS_IT_ORG_UNIT_PATH
orgUnitPath=
