## This file maps the annotated display keys from your source files (such as @ConnectorClass
## and @ConfigurationProperty) to their string values for display in the application's UI
GoogleApps.connector.display=GoogleApps Connector
domain.display=Domain name
domain.help=Internet domain name. See https://support.google.com/a/answer/177483?hl=en
productid.display=Product ID
productid.help=Product ID. For more information see https://developers.google.com/admin-sdk/licensing/v1/how-tos/products
skuid.display=SKU ID
skuid.help=Stock Keeping Units (SKU) ID. For more information see https://developers.google.com/admin-sdk/licensing/v1/how-tos/products
autoaddlic.display=Auto Add License
autoaddlic.help=Automatically add license to user after create
refreshtoken.display=Refresh token
refreshtoken.help=The refresh token allows you to get a new access token that is good for another hour. Refresh tokens never expire, they can only be revoked by the user or programatically by your app. Must be set if using OAuth 2.0 client with authorization code flow for Google API access.
clientid.display=Client Id
clientid.help=Client identifier issued to the OAuth 2.0 client.
clientsecret.display=Client Secret
clientsecret.help=Client secret issued to the client during the registration process. Must be set if using OAuth 2.0 client with authorization code flow for Google API access.
serviceaccountkeyjson.display=Service Account Key in JSON format
serviceaccountkeyjson.help=Service account key in JSON format. Must be set if a service account is used for Google API access.
serviceaccountdelegateduser.display=Service Account Delegated User
serviceaccountdelegateduser.help=Delegated user's email for Service Account. You need to delegate domain-wide authority to your service account. To do this, set the email of the user to be impersonated, who must have admin privileges. Must be set if a service account is used for Google API access.
serviceaccountscopes.display=Service Account OAuth Scopes
serviceaccountscopes.help=Custom OAuth scopes for Service Account authentication. If not specified, default scopes will be used: https://www.googleapis.com/auth/admin.directory.user, https://www.googleapis.com/auth/admin.directory.group, https://www.googleapis.com/auth/apps.licensing. Provide as an array of scope URLs to override defaults.
basic.group=Basic Configuration Properties
MESSAGE_OBJECT_CLASS___ACCOUNT__=Account
MESSAGE_OBJECT_CLASS___GROUP__=Group

ATTRS_TO_GET.help=Specifying which fields to include in a partial response.
PAGED_RESULTS_COOKIE.help=Token to specify next page in the list.
PAGE_SIZE.help=Maximum number of results to return.
SORT_KEYS.help=Property to use for sorting results.
showDeleted.help=If set to true, retrieves the list of deleted users. Default is false.

allowCache.display=Allow Cache
allowCache.help=Allow caching of resource objects such as users to prevent unnecessary remote calls.
maxCacheTTL.display=Max Cache TTL (in millis)
maxCacheTTL.help=Max Cache TTL (Time To Live) in millis. E.g. 300000 means 5 minutes.
ignoreCacheAfterUpdateTTL.display=Ignored Cache After Update TTL (in millis)
ignoreCacheAfterUpdateTTL.help=Time to ignore the object cache after object update in millis. In this period after update the cache will be completely switched off for the object.

# HTTP Proxy Configuration
proxy.group=HTTP Proxy Configuration
httpProxyHost.display=HTTP Proxy Host
httpProxyHost.help=HTTP proxy server hostname or IP address. Leave blank to disable proxy.
httpProxyPort.display=HTTP Proxy Port
httpProxyPort.help=HTTP proxy server port number.
httpProxyUser.display=HTTP Proxy Username
httpProxyUser.help=Username for HTTP proxy authentication. Leave blank if proxy doesn't require authentication.
httpProxyPassword.display=HTTP Proxy Password
httpProxyPassword.help=Password for HTTP proxy authentication. Leave blank if proxy doesn't require authentication.

# HTTP Timeout Configuration
timeout.group=HTTP Timeout Configuration
httpConnectTimeout.display=HTTP Connect Timeout (ms)
httpConnectTimeout.help=HTTP connection timeout in milliseconds. Default is 10000 (10 seconds).
httpSocketTimeout.display=HTTP Socket Timeout (ms)
httpSocketTimeout.help=HTTP socket (read) timeout in milliseconds. Default is 10000 (10 seconds).
httpConnectionRequestTimeout.display=HTTP Connection Request Timeout (ms)
httpConnectionRequestTimeout.help=Timeout in milliseconds used when requesting a connection from the connection manager. Default is 10000 (10 seconds).

# Paging Configuration
paging.group=Paging Configuration
userPagingMaxResults.display=User Paging Max Results
userPagingMaxResults.help=Maximum number of results to request from Google Directory API per page for User searches. This controls memory usage and API efficiency. Default is 500 (Google API maximum). Valid range: 1-500.
groupPagingMaxResults.display=Group Paging Max Results
groupPagingMaxResults.help=Maximum number of results to request from Google Directory API per page for Group searches. This controls memory usage and API efficiency. Default is 200 (Google API maximum). Valid range: 1-200.

# Advanced Configuration
advanced.group=Advanced Configuration
directoryBaseUrl.display=Directory API Base URL
directoryBaseUrl.help=Base URL for Google Directory API. Default is https://admin.googleapis.com/. Only change this for custom Google environments.
licensingBaseUrl.display=Licensing API Base URL
licensingBaseUrl.help=Base URL for Google Licensing API. Default is https://licensing.googleapis.com/. Only change this for custom Google environments.
oauth2TokenServerUrl.display=OAuth2 Token Server URL
oauth2TokenServerUrl.help=OAuth2 token server URL for authentication. Default is https://oauth2.googleapis.com/token. Only change this for custom Google environments.
